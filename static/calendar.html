<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח פגישות | אורן כהן גרופ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

  .header {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(99,102,241,0.3);
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header a { color: rgba(255,255,255,0.85); font-size: 12px; text-decoration: none; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; transition: all 0.2s; white-space: nowrap; }
  .header a:hover { background: rgba(255,255,255,0.15); color: #fff; }

  .main { padding: 12px; max-width: 1000px; margin: 0 auto; }

  /* Agent selector */
  .agent-bar {
    background: #fff; border-radius: 16px; padding: 14px 16px;
    margin-bottom: 16px; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .agent-bar-label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; display: block; }
  .agent-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .agent-btn {
    padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid #e2e8f0; background: #f8fafc;
    cursor: pointer; font-size: 13px; font-weight: 600;
    color: #475569; transition: all 0.15s;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .agent-btn:hover { border-color: #6366f1; color: #6366f1; background: #eef2ff; }
  .agent-btn.active { border-color: #6366f1; background: #6366f1; color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
  .agent-btn.manager { border-color: #f59e0b; color: #92400e; background: #fffbeb; }
  .agent-btn.manager:hover { border-color: #d97706; background: #fef3c7; color: #78350f; }
  .agent-btn.manager.active { background: #f59e0b; color: #fff; border-color: #f59e0b; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }

  /* Calendar card */
  .cal-card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .cal-title { font-size: 17px; font-weight: 700; color: #1e293b; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    padding: 7px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: #475569;
    transition: all 0.2s;
  }
  .cal-nav button:hover { border-color: #6366f1; color: #6366f1; }
  .cal-nav .btn-today { background: #6366f1; color: #fff; border-color: #6366f1; }
  .cal-nav .btn-today:hover { background: #4f46e5; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day-name {
    text-align: center; font-size: 11px; font-weight: 700;
    color: #94a3b8; padding: 6px 0;
  }
  .cal-cell {
    background: #f8fafc; border-radius: 8px; min-height: 64px; padding: 5px;
    border: 1.5px solid transparent; cursor: pointer; transition: all 0.15s;
  }
  .cal-cell:hover { background: #eef2ff; border-color: #c7d2fe; }
  .cal-cell.has-meetings { background: #faf5ff; }
  .cal-cell.today { border-color: #6366f1; background: #eef2ff; }
  .cal-cell.selected { border-color: #6366f1; background: #eef2ff; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
  .cal-cell.other-month { opacity: 0.3; }
  .cal-date {
    font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 3px;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .cal-cell.today .cal-date { background: #6366f1; color: #fff; }
  .cal-dot {
    font-size: 9px; background: #6366f1; color: #fff; border-radius: 4px;
    padding: 1px 4px; margin-bottom: 2px; display: block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-dot.manager-dot { background: #8b5cf6; }
  .cal-more { font-size: 9px; color: #94a3b8; margin-top: 1px; }

  /* Day panel */
  .day-panel {
    background: #fff; border-radius: 16px; padding: 16px;
    margin-top: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .day-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
  .day-panel-title { font-size: 15px; font-weight: 700; color: #1e293b; }
  .day-panel-count { font-size: 12px; color: #94a3b8; margin-top: 2px; }

  .btn-add {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    transition: all 0.2s; display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }

  .meeting-card {
    border: 1.5px solid #f1f5f9; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    transition: all 0.15s; background: #fafafa;
  }
  .meeting-card:hover { border-color: #c7d2fe; background: #faf5ff; }
  .meeting-time-badge {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border-radius: 8px; padding: 7px 10px;
    font-size: 13px; font-weight: 700; min-width: 56px; text-align: center;
    box-shadow: 0 2px 6px rgba(99,102,241,0.25); flex-shrink: 0;
  }
  .meeting-info { flex: 1; min-width: 0; }
  .meeting-client { font-size: 14px; font-weight: 600; color: #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meeting-agent { font-size: 11px; color: #64748b; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .meeting-notes { font-size: 11px; color: #94a3b8; margin-top: 3px; display: flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-delete {
    background: #fff; color: #ef4444; border: 1.5px solid #fecaca;
    border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 12px;
    transition: all 0.15s; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
  }
  .btn-delete:hover { background: #fee2e2; border-color: #ef4444; }

  .empty { text-align: center; color: #94a3b8; padding: 32px 16px; font-size: 14px; }
  .empty-icon { margin-bottom: 10px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; top:0;left:0;width:100%;height:100%;
    background: rgba(15,23,42,0.5); z-index: 1000;
    align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px;
    padding: 24px 20px 32px; box-shadow: 0 -8px 40px rgba(0,0,0,0.15);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
  .modal-title { font-size: 17px; font-weight: 700; color: #1e293b; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .modal label { font-size: 12px; font-weight: 600; color: #64748b; display: block; margin-bottom: 5px; }
  .modal input, .modal textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 12px;
    transition: border-color 0.15s; color: #1e293b;
  }
  .modal input:focus, .modal textarea:focus { border-color: #6366f1; }
  .modal textarea { min-height: 70px; resize: none; font-size: 16px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .btn-cancel {
    flex: 1; background: #f1f5f9; color: #475569; border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel:hover { background: #e2e8f0; }
  .btn-add { flex: 2; }

  @media (min-width: 600px) {
    .main { padding: 20px; }
    .header { padding: 16px 24px; }
    .header h1 { font-size: 20px; }
    .agent-bar { padding: 16px 20px; }
    .cal-card { padding: 20px; border-radius: 20px; }
    .cal-cell { min-height: 80px; padding: 7px; }
    .cal-date { font-size: 13px; width: 24px; height: 24px; }
    .cal-dot { font-size: 10px; }
    .day-panel { padding: 20px; border-radius: 20px; }
    .modal-overlay { align-items: center; }
    .modal { border-radius: 20px; max-width: 440px; padding: 28px; }
    @keyframes modalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-left:8px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    לוח פגישות
  </h1>
  <a href="/static/hub.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-left:5px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    בית
  </a>
</div>

<div class="main">

  <div class="agent-bar">
    <span class="agent-bar-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-left:4px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      בחר סוכן:
    </span>
    <div class="agent-btns" id="agent-btns"></div>
  </div>

  <div class="cal-card">
    <div class="cal-header">
      <div class="cal-title" id="month-title">בחר סוכן להצגת לוח</div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹ קודם</button>
        <button class="btn-today" onclick="goToday()">היום</button>
        <button onclick="changeMonth(1)">הבא ›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid">
      <div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:40px;font-size:14px;">בחר סוכן כדי להציג את לוח הפגישות</div>
    </div>
  </div>

  <div class="day-panel" id="day-panel" style="display:none">
    <div class="day-panel-header">
      <div>
        <div class="day-panel-title" id="day-panel-title"></div>
        <div class="day-panel-count" id="day-panel-count"></div>
      </div>
      <button class="btn-add" id="btn-add" style="display:none" onclick="openAddModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        הוסף פגישה
      </button>
    </div>
    <div id="meetings-list"></div>
  </div>

</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px;margin-left:7px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
      פגישה חדשה
    </div>
    <label>שם לקוח *</label>
    <input type="text" id="client-name" placeholder="ישראל ישראלי" />
    <label>שעה</label>
    <input type="time" id="meeting-time" value="10:00" />
    <label>סוג פגישה</label>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <label style="flex:1;display:flex;align-items:center;gap:6px;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:#1e293b" id="lbl-frontal">
        <input type="radio" name="meeting_type" value="frontal" checked onchange="updateTypeLabels()"> פרונטלי
      </label>
      <label style="flex:1;display:flex;align-items:center;gap:6px;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:#1e293b" id="lbl-zoom">
        <input type="radio" name="meeting_type" value="zoom" onchange="updateTypeLabels()"> זום
      </label>
    </div>
    <div id="zoom-link-row" style="display:none">
      <label>קישור זום</label>
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
        <input type="url" id="zoom-link" placeholder="https://us06web.zoom.us/j/..." style="margin-bottom:0;flex:1" />
        <button type="button" onclick="openOfficeZoom()" style="background:#2D8CFF;color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-left:4px"><rect x="2" y="7" width="15" height="10" rx="2"/><path d="M17 9l5-2v10l-5-2"/></svg>
          צור שיחה
        </button>
      </div>
    </div>
    <label>סוכן מטפל</label>
    <input type="text" id="handled-by" placeholder="שם הסוכן המטפל" />
    <label>הערות</label>
    <textarea id="meeting-notes" placeholder="פרטים נוספים..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      <button class="btn-add" onclick="addMeeting()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        שמור פגישה
      </button>
    </div>
  </div>
</div>

<script>
const AGENTS = [
  { label: 'יניב', email: 'yaniv@orencohengroup.com' },
  { label: 'משה', email: 'moshe@orencohengroup.com' },
  { label: 'מירי', email: 'miri@orencohengroup.com' },
  { label: 'מיכאל', email: 'michael@orencohengroup.com' },
  { label: 'רבקה', email: 'rivka@orencohengroup.com' },
  { label: 'אוריאל', email: 'uriel400@orencohengroup.com' },
  { label: 'אלחנן', email: 'elchanan@orencohengroup.com' },
  { label: 'אורן', email: 'oren@orencohengroup.com' },
  { label: 'אריה', email: 'aryeh@orencohengroup.com' },
  { label: 'בועז', email: 'office@orencohengroup.com' },
  { label: 'חנה', email: 'hannah@orencohengroup.com' },
  { label: 'אהרון', email: 'aaron@orencohengroup.com' },
  { label: 'ליסה', email: 'lisa@orencohengroup.com' },
  { label: 'דב', email: 'dovr@orencohengroup.com' },
  { label: 'נעמי', email: 'NaomiS@orencohengroup.com' },
  { label: 'יהודית', email: 'YehuditH@orencohengroup.com' },
  { label: 'רוני', email: 'roni@orencohengroup.com', isManager: true },
];

let currentAgent = null;
let currentMonth = new Date();
let selectedDate = null;
let allMeetings = {};

const DAY_NAMES = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAY_NAMES_FULL = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

const agentBtns = document.getElementById('agent-btns');
AGENTS.forEach(a => {
  const btn = document.createElement('button');
  btn.className = 'agent-btn' + (a.isManager ? ' manager' : '');
  const starSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="flex-shrink:0"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  btn.innerHTML = a.isManager ? `${starSvg} ${a.label}` : a.label;
  btn.onclick = (e) => selectAgent(a, e.currentTarget);
  agentBtns.appendChild(btn);
});

function selectAgent(a, btn) {
  if (a.isManager) {
    const pw = prompt('סיסמת מנהל:');
    if (pw !== '332211') { alert('סיסמה שגויה'); return; }
  }
  currentAgent = a;
  document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDate = new Date();
  currentMonth = new Date();
  loadMonthMeetings();
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function changeMonth(dir) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + dir, 1);
  loadMonthMeetings();
}

function goToday() {
  currentMonth = new Date();
  selectedDate = new Date();
  loadMonthMeetings();
}

async function loadMonthMeetings() {
  if (!currentAgent) return;
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const startDate = formatDate(new Date(year, month, 1));
  const endDate = formatDate(new Date(year, month+1, 0));
  const url = currentAgent.isManager
    ? `/api/meetings?start=${startDate}&end=${endDate}`
    : `/api/meetings?start=${startDate}&end=${endDate}&agent=${encodeURIComponent(currentAgent.label)}`;
  allMeetings = {};
  const data = await fetch(url).then(r => r.json());
  (data.meetings || []).forEach(m => {
    if (!allMeetings[m.meeting_date]) allMeetings[m.meeting_date] = [];
    allMeetings[m.meeting_date].push(m);
  });
  renderCalendar();
  if (selectedDate) showDayPanel(selectedDate);
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('month-title').textContent = `${MONTH_NAMES[month]} ${year}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  DAY_NAMES.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });
  const firstDow = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month+1, 0).getDate();
  const todayStr = formatDate(new Date());
  const selectedStr = selectedDate ? formatDate(selectedDate) : '';
  for (let i = 0; i < firstDow; i++) {
    const prev = new Date(year, month, -firstDow+i+1);
    grid.appendChild(makeCell(prev, true, todayStr, selectedStr));
  }
  for (let d = 1; d <= lastDate; d++) {
    grid.appendChild(makeCell(new Date(year, month, d), false, todayStr, selectedStr));
  }
  const lastDow = new Date(year, month, lastDate).getDay();
  for (let i = lastDow+1; i < 7; i++) {
    grid.appendChild(makeCell(new Date(year, month+1, i-lastDow), true, todayStr, selectedStr));
  }
}

function makeCell(date, otherMonth, todayStr, selectedStr) {
  const dateStr = formatDate(date);
  const meetings = allMeetings[dateStr] || [];
  const cell = document.createElement('div');
  cell.className = 'cal-cell' +
    (otherMonth ? ' other-month' : '') +
    (meetings.length ? ' has-meetings' : '') +
    (dateStr === todayStr ? ' today' : '') +
    (dateStr === selectedStr ? ' selected' : '');
  const dateEl = document.createElement('div');
  dateEl.className = 'cal-date';
  dateEl.textContent = date.getDate();
  cell.appendChild(dateEl);
  meetings.slice(0,2).forEach(m => {
    const dot = document.createElement('span');
    dot.className = 'cal-dot' + (currentAgent?.isManager ? ' manager-dot' : '');
    dot.textContent = `${m.meeting_time} ${m.client_name}`;
    cell.appendChild(dot);
  });
  if (meetings.length > 2) {
    const more = document.createElement('div');
    more.className = 'cal-more';
    more.textContent = `+${meetings.length-2} עוד`;
    cell.appendChild(more);
  }
  cell.onclick = () => { selectedDate = new Date(date); renderCalendar(); showDayPanel(date); };
  return cell;
}

function showDayPanel(date) {
  const dateStr = formatDate(date);
  document.getElementById('day-panel').style.display = 'block';
  document.getElementById('day-panel-title').textContent =
    `יום ${DAY_NAMES_FULL[date.getDay()]}, ${date.getDate()} ב${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
  const meetings = allMeetings[dateStr] || [];
  document.getElementById('day-panel-count').textContent =
    meetings.length ? `${meetings.length} פגישות` : 'אין פגישות';
  document.getElementById('btn-add').style.display = currentAgent?.isManager ? 'none' : 'flex';
  const list = document.getElementById('meetings-list');
  const isManager = currentAgent?.isManager;
  if (!meetings.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>אין פגישות ביום זה</div>';
    return;
  }
  list.innerHTML = meetings.map(m => `
    <div class="meeting-card">
      <div class="meeting-time-badge">${m.meeting_time}</div>
      <div class="meeting-info">
        <div class="meeting-client">${m.client_name}</div>
        ${isManager ? `<div class="meeting-agent"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${m.agent_name}</div>` : ''}
        ${m.handled_by ? `<div class="meeting-agent"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> סוכן מטפל: ${m.handled_by}</div>` : ''}
        <div class="meeting-agent" style="color:${m.meeting_type==='zoom'?'#6366f1':'#16a34a'}">
          ${m.meeting_type === 'zoom'
            ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="15" height="10" rx="2"/><path d="M17 9l5-2v10l-5-2"/></svg> זום${m.zoom_link ? ` — <a href="${m.zoom_link}" target="_blank" style="color:#6366f1;text-decoration:underline">פתח פגישה</a>` : ''}`
            : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> פרונטלי`
          }
        </div>
        ${m.notes ? `<div class="meeting-notes"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ${m.notes}</div>` : ''}
      </div>
      ${!isManager ? `<button class="btn-delete" onclick="deleteMeeting(${m.id})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        מחק
      </button>` : ''}
    </div>
  `).join('');
}

const OFFICE_ZOOM = 'https://us06web.zoom.us/j/5337960815';

function openOfficeZoom() {
  document.getElementById('zoom-link').value = OFFICE_ZOOM;
  window.open(OFFICE_ZOOM, '_blank');
}

function updateTypeLabels() {
  const frontal = document.querySelector('input[value="frontal"]').checked;
  document.getElementById('lbl-frontal').style.borderColor = frontal ? '#16a34a' : '#e2e8f0';
  document.getElementById('lbl-zoom').style.borderColor = !frontal ? '#6366f1' : '#e2e8f0';
  document.getElementById('zoom-link-row').style.display = !frontal ? 'block' : 'none';
}

function openAddModal() { document.getElementById('add-modal').classList.add('open'); updateTypeLabels(); }
function closeModal() { document.getElementById('add-modal').classList.remove('open'); }

async function addMeeting() {
  const clientName = document.getElementById('client-name').value.trim();
  const time = document.getElementById('meeting-time').value;
  const meetingType = document.querySelector('input[name="meeting_type"]:checked').value;
  const handledBy = document.getElementById('handled-by').value.trim();
  const zoomLink = document.getElementById('zoom-link').value.trim();
  const notes = document.getElementById('meeting-notes').value.trim();
  if (!clientName) { alert('נא להזין שם לקוח'); return; }
  await fetch('/api/meetings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent_name: currentAgent.label, agent_email: currentAgent.email, client_name: clientName, meeting_date: formatDate(selectedDate), meeting_time: time, meeting_type: meetingType, handled_by: handledBy, zoom_link: zoomLink, notes })
  });
  document.getElementById('client-name').value = '';
  document.getElementById('handled-by').value = '';
  document.getElementById('zoom-link').value = '';
  document.getElementById('meeting-notes').value = '';
  document.querySelector('input[value="frontal"]').checked = true;
  updateTypeLabels();
  closeModal();
  await loadMonthMeetings();
}

async function deleteMeeting(id) {
  if (!confirm('למחוק פגישה זו?')) return;
  await fetch(`/api/meetings/${id}`, { method: 'DELETE' });
  await loadMonthMeetings();
}

document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('add-modal')) closeModal();
});
</script>
</body>
