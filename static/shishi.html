<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שישי של פעם — אורן כהן גרופ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans Hebrew', sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      position: relative;
    }

    /* התמונה המקורית */
    .bg-img {
      width: 100%;
      display: block;
    }

    /* שכבת התאריך החדש — מודבקת מעל התאריך הישן */
    .date-overlay {
      position: absolute;
      bottom: 36.5%;
      right: 5%;
      left: 5%;
      text-align: center;
      pointer-events: none;
    }

    .date-new {
      display: inline-block;
      background: #f5f0e8;
      color: #2a1f0e;
      font-size: clamp(11px, 2.2vw, 13px);
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 2px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      border: 1.5px solid #c9a84c;
    }

    /* כפתור הרשמה — מעל כפתור הרשמה בתמונה */
    .register-overlay {
      position: absolute;
      bottom: 19%;
      left: 3%;
      width: 32%;
    }

    .register-btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      background: #c9a84c;
      color: white;
      text-align: center;
      font-size: clamp(13px, 2.5vw, 16px);
      font-weight: 700;
      font-family: 'Noto Sans Hebrew', sans-serif;
      border: none;
      cursor: pointer;
      text-decoration: none;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .register-btn:hover { background: #b8943a; }

    /* מודל */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #f5f0e8;
      border: 1.5px solid #c9a84c;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      direction: rtl;
      border-radius: 4px;
    }

    .modal h2 {
      font-size: 20px;
      color: #c9a84c;
      margin-bottom: 4px;
      text-align: center;
    }

    .modal-sub {
      text-align: center;
      font-size: 12px;
      color: #6a5a48;
      margin-bottom: 18px;
    }

    .modal label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a3a28;
      margin: 10px 0 3px;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #c9a84c;
      background: white;
      font-size: 13px;
      font-family: 'Noto Sans Hebrew', sans-serif;
      color: #2a1f0e;
      outline: none;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-btns button {
      flex: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Noto Sans Hebrew', sans-serif;
      border-radius: 3px;
    }

    .btn-submit { background: #c9a84c; color: white; }
    .btn-submit:hover { background: #b8943a; }
    .btn-cancel { background: #ddd; color: #555; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 10px;
    }
    .success-msg .check { font-size: 38px; margin-bottom: 8px; }
    .success-msg h3 { font-size: 17px; color: #c9a84c; margin-bottom: 6px; }
    .success-msg p { font-size: 12px; color: #6a5a48; line-height: 1.6; }
  </style>
</head>
<body>

<div class="card">
  <img class="bg-img" src="/static/shishi-bg.png" alt="שישי של פעם" />

  <!-- תאריך חדש מודבק מעל הישן -->
  <div class="date-overlay">
    <span class="date-new">יום ראשון כ״ז אלול | 27.09.2025 | 16:30</span>
  </div>

  <!-- כפתור הרשמה עכשיו -->
  <div class="register-overlay">
    <a href="#" class="register-btn" onclick="openModal(); return false;">הרשמו עכשיו</a>
  </div>
</div>

<!-- מודל הרשמה -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div id="form-section">
      <h2>הרשמה לאירוע</h2>
      <div class="modal-sub">שישי של פעם | יום ראשון 27.09.2025 | 16:30</div>

      <label>שם מלא *</label>
      <input type="text" id="reg-name" placeholder="ישראל ישראלי" />

      <label>טלפון *</label>
      <input type="tel" id="reg-phone" placeholder="050-0000000" />

      <label>מספר משתתפים</label>
      <select id="reg-guests">
        <option value="1">1 משתתף</option>
        <option value="2" selected>2 משתתפים</option>
        <option value="3">3 משתתפים</option>
        <option value="4">4 משתתפים</option>
        <option value="5">5+</option>
      </select>

      <div class="modal-btns">
        <button class="btn-submit" onclick="submitReg()">אישור הגעה ✓</button>
        <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      </div>
    </div>

    <div class="success-msg" id="success-msg">
      <div class="check">✅</div>
      <h3>ההרשמה התקבלה!</h3>
      <p>תודה, נשמח לראותך<br>יום ראשון 27.09.2025 בשעה 16:30<br>הקרן הקיימת 33, ירושלים</p>
      <br>
      <button class="btn-submit" style="width:100%;padding:10px;" onclick="closeModal()">סגור</button>
    </div>
  </div>
</div>

<script>
  function openModal() {
    document.getElementById('modal-overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('form-section').style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
    document.getElementById('reg-name').value = '';
    document.getElementById('reg-phone').value = '';
  }

  async function submitReg() {
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const guests = document.getElementById('reg-guests').value;
    if (!name || !phone) { alert('נא למלא שם וטלפון'); return; }
    try {
      await fetch('/api/shishi/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, guests })
      });
    } catch(e) {}
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }
</script>
</body>
</html>
