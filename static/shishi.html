<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans Hebrew', sans-serif; background: #e6e6e6; margin: 0; padding: 0; }
    
    /* יצירת קונטיינר כדי שכל המידות יהיו יחסיות אליו */
    .card { width: 100%; max-width: 1000px; margin: 0 auto; position: relative; container-type: inline-size; }
    
    /* תמונת הרקע קובעת את גובה הבלוק באופן טבעי (ללא עיוותים) */
    .img-wrapper { position: relative; width: 100%; overflow: hidden; }
    .bg-img { width: 100%; height: auto; display: block; }

    /* תאריך נעול */
    .date-overlay { position: absolute; top: 69.92%; left: 53.36%; z-index: 10; pointer-events: none; }
    .date-new { display: inline-block; background: #e6e6e6; color: #3a3020; font-size: 1.8cqw; font-weight: 600; font-family: 'Noto Sans Hebrew', sans-serif; padding: 0.3cqw 1cqw; white-space: nowrap; line-height: 1.6; }

    /* לוגו 1 נעול */
    .logo1-overlay { position: absolute; top: 4.37%; left: 56.92%; width: 25%; z-index: 10; pointer-events: none; }
    .logo1-overlay img { width: 100%; display: block; }

    /* לוגו 2 נעול */
    .logo2-overlay { position: absolute; top: 13.51%; left: 58.10%; width: 25%; z-index: 10; pointer-events: none; }
    .logo2-overlay img { width: 100%; display: block; }

    /* כפתור נעול */
    .register-overlay { position: absolute; top: 78.66%; left: 58.02%; width: 22%; z-index: 10; pointer-events: all; }
    .register-btn { display: block; width: 100%; padding: 3cqw 1cqw; background: #c9a84c; color: #000; text-align: center; font-size: 1.8cqw; font-weight: 900; font-family: 'Noto Sans Hebrew', sans-serif; letter-spacing: 1px; border: none; cursor: pointer; text-decoration: none; transition: background 0.2s; pointer-events: none; }
    .register-btn:hover { background: #b8943a; }

    /* מלבן קישורים נעול */
    .contact-overlay { position: absolute; top: 78.89%; left: 19.68%; width: 36%; z-index: 10; pointer-events: none; }
    .contact-box { background: #e6e6e6; padding: 1.5cqw; pointer-events: all; }
    .contact-box .title { font-size: 1.4cqw; font-weight: 700; color: #c9a84c; margin-bottom: 0.3cqw; font-family: 'Noto Sans Hebrew', sans-serif; direction: ltr; text-align: left; }
    .contact-box .name { font-size: 1.8cqw; font-weight: 700; color: #c9a84c; margin-bottom: 1cqw; font-family: 'Noto Sans Hebrew', sans-serif; direction: ltr; text-align: left; }
    .contact-box .links { border-left: 2px solid #c9a84c; padding-left: 1cqw; }
    .contact-box a { display: block; font-size: 1.2cqw; font-weight: 700; color: #c9a84c; text-decoration: none; margin: 0.6cqw 0; font-family: 'Noto Sans Hebrew', sans-serif; pointer-events: all; line-height: 1.6; direction: ltr; text-align: left; display: flex; align-items: center; }
    .contact-box a:hover { opacity: 0.8; }
    
    /* שליטה אוטומטית בגודל האייקונים (דריסה של הסטייל המוטמע) */
    .contact-box a svg { width: 1.5cqw !important; height: 1.5cqw !important; margin-left: 0.5cqw !important; flex-shrink: 0; }

    /* מודל */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #f5f0e8; border: 1.5px solid #c9a84c; padding: 28px 24px; width: 100%; max-width: 400px; direction: rtl; border-radius: 4px; }
    .modal h2 { font-size: 20px; color: #c9a84c; margin-bottom: 4px; text-align: center; }
    .modal-sub { text-align: center; font-size: 12px; color: #6a5a48; margin-bottom: 18px; }
    .modal label { display: block; font-size: 12px; font-weight: 600; color: #4a3a28; margin: 10px 0 3px; }
    .modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid #c9a84c; background: white; font-size: 13px; font-family: 'Noto Sans Hebrew', sans-serif; color: #2a1f0e; outline: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; font-family: 'Noto Sans Hebrew', sans-serif; border-radius: 3px; }
    .btn-submit { background: #c9a84c; color: white; }
    .btn-submit:hover { background: #b8943a; }
    .btn-cancel { background: #ddd; color: #555; }
    .success-msg { display: none; text-align: center; padding: 10px; }
    .success-msg .check { font-size: 38px; margin-bottom: 8px; }
    .success-msg h3 { font-size: 17px; color: #c9a84c; margin-bottom: 6px; }
    .success-msg p { font-size: 12px; color: #6a5a48; line-height: 1.6; }
  </style>
