<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קמפיין מייל | אורן כהן גרופ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header h1 { font-size: 20px; }
  .header-nav { display: flex; gap: 12px; align-items: center; }
  .btn-nav {
    padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
    color: #fff; text-decoration: none;
  }
  .btn-nav:hover { background: rgba(255,255,255,0.2); }
  .main { padding: 24px; max-width: 960px; margin: 0 auto; }
  .section {
    background: #fff; border-radius: 14px; padding: 24px;
    margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .section-title {
    font-size: 16px; font-weight: bold; margin-bottom: 16px;
    color: #1a1a2e; display: flex; align-items: center; gap: 8px;
  }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box {
    background: #f8f9ff; border: 1px solid #e0e7ff;
    border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 100px;
  }
  .stat-num { font-size: 22px; font-weight: bold; color: #4338ca; }
  .stat-label { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: #1a1a2e; color: #fff; }
  th { padding: 10px 12px; text-align: right; font-weight: 600; }
  td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
  tr:hover td { background: #f8faff; }
  tr:last-child td { border-bottom: none; }
  .s-pending { background: #fef9c3; color: #854d0e; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .s-sent { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .btn { padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
  .btn-secondary:hover { background: #e5e7eb; }
  .modal-overlay {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; width: 680px;
    max-width: 95vw; max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #e5e7eb;
    display: flex; justify-content: space-between; align-items: center;
    background: #1a1a2e; border-radius: 14px 14px 0 0; color: #fff;
  }
  .modal-header h3 { font-size: 16px; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #fff; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
  .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-bar input, .filter-bar select {
    padding: 7px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📧 קמפיין מייל — אורן כהן גרופ</h1>
  <div class="header-nav">
    <a class="btn-nav" href="/conversations">💬 WhatsApp</a>
    <a class="btn-nav" href="/hub">🏠 בית</a>
  </div>
</div>

<div class="main">

  <div class="section">
    <div class="section-title">📊 סטטיסטיקות מייל</div>
    <div class="stats" id="email-stats">
      <div class="stat-box"><div class="stat-num" id="s-total">—</div><div class="stat-label">נשלחו</div></div>
      <div class="stat-box"><div class="stat-num" id="s-replied" style="color:#166534">—</div><div class="stat-label">ענו</div></div>
      <div class="stat-box"><div class="stat-num" id="s-pending" style="color:#854d0e">—</div><div class="stat-label">לא ענו</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📬 שיחות מייל פעילות</div>
    <div class="filter-bar">
      <input type="text" id="search-email" placeholder="חיפוש שם / מייל..." oninput="renderTable()">
      <select id="filter-replied" onchange="renderTable()">
        <option value="">כל הסטטוסים</option>
        <option value="replied">ענו</option>
        <option value="pending">לא ענו</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>שם</th>
            <th>מייל</th>
            <th>סוכן</th>
            <th>תאריך שליחה</th>
            <th>סטטוס</th>
            <th>תמליל</th>
          </tr>
        </thead>
        <tbody id="email-tbody"><tr><td colspan="6" style="text-align:center;color:#9ca3af">טוען...</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal תמליל -->
<div class="modal-overlay" id="transcript-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="transcript-title">📧 תמליל שיחת מייל</h3>
      <button class="modal-close" onclick="document.getElementById('transcript-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="transcript-body"></div>
  </div>
</div>

<script>
let allConvs = [];

async function loadData() {
  try {
    const res = await fetch('/api/email/sent');
    const data = await res.json();
    allConvs = data.conversations || [];

    const total = allConvs.length;
    const replied = allConvs.filter(c => c.replied).length;
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-replied').textContent = replied;
    document.getElementById('s-pending').textContent = total - replied;

    renderTable();
  } catch(e) { console.error(e); }
}

function renderTable() {
  const search = document.getElementById('search-email').value.toLowerCase();
  const filterReplied = document.getElementById('filter-replied').value;

  let rows = allConvs.filter(c => {
    const email = (c.phone || '').replace('email:', '');
    if (search && !(c.client_name||'').toLowerCase().includes(search) && !email.toLowerCase().includes(search)) return false;
    if (filterReplied === 'replied' && !c.replied) return false;
    if (filterReplied === 'pending' && c.replied) return false;
    return true;
  });

  const tbody = document.getElementById('email-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#9ca3af">אין שיחות להצגה</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(c => {
    const email = (c.phone || '').replace('email:', '');
    const badge = c.replied
      ? '<span class="s-sent">ענה ✓</span>'
      : '<span class="s-pending">ממתין...</span>';
    const date = c.sent_at ? new Date(c.sent_at).toLocaleString('he-IL') : '—';
    const hasTranscript = c.transcript && c.transcript.trim().length > 0;
    return `<tr>
      <td><strong>${c.client_name || '—'}</strong></td>
      <td style="direction:ltr;color:#6b7280">${email}</td>
      <td style="font-size:12px;color:#6b7280">${c.agent_email || '—'}</td>
      <td style="font-size:12px">${date}</td>
      <td>${badge}</td>
      <td>${hasTranscript
        ? `<button class="btn btn-secondary" style="padding:4px 10px;font-size:12px"
            onclick="showTranscript('${(c.client_name||'').replace(/'/g,"\\'")}', this.dataset.t)"
            data-t="${(c.transcript||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}">📄 צפה</button>`
        : '<span style="color:#9ca3af;font-size:12px">אין עדיין</span>'
      }</td>
    </tr>`;
  }).join('');
}

function showTranscript(name, text) {
  document.getElementById('transcript-title').textContent = `📧 תמליל — ${name}`;
  const hasHebrew = /[\u05d0-\u05ea]/.test(text || '');
  const body = document.getElementById('transcript-body');
  body.style.direction = hasHebrew ? 'rtl' : 'ltr';
  body.style.textAlign = hasHebrew ? 'right' : 'left';
  body.textContent = text || 'אין תמליל';
  document.getElementById('transcript-modal').classList.add('open');
}

loadData();
setInterval(loadData, 15000);
</script>
</body>
</html>
